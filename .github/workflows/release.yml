name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.0)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            # Use the pushed tag name verbatim (e.g. "v1.0.0" or "1.0.0") so the
            # release we create/update below lines up with the tag that triggered it.
            $tag = "${{ github.ref_name }}"
            $version = $tag -replace '^v', ''
          } else {
            $tag = "${{ github.event.inputs.version }}"
            if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "0.0.0-dev" }
            $version = $tag -replace '^v', ''
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained executable
        run: >
          dotnet publish src/SteamGameLoader/SteamGameLoader.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            installer\setup.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamGameLoadingPopup-Setup
          path: installer/output/*.exe

      - name: Create or update GitHub Release
        # Runs for an actual tag push AND for a manually-typed workflow_dispatch
        # version, so "Run workflow" with a real version number also publishes/
        # updates that release - skipped only for the default placeholder used
        # to just test that the build compiles.
        if: steps.version.outputs.tag != '0.0.0-dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: installer/output/*.exe
          name: Steam Loading Popups ${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
